<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>觀察標的趨勢｜Qian</title>
    <style>
      :root {
        --b: #fff9e8;
        --s: #fffdf6;
        --t: #493629;
        --m: #806f60;
        --l: #e8d7b5;
        --u: #c6534f;
        --d: #2f7d5b;
        --c: #b9783e;
        --ma: #a66b12;
        --ma60: #6f5aa8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--b);
        color: var(--t);
        font:
          14px/1.6 system-ui,
          "Noto Sans TC",
          sans-serif;
      }

      main {
        max-width: 900px;
        margin: auto;
        padding: 22px;
      }

      a {
        color: var(--c);
        font-weight: 700;
        text-decoration: none;
      }

      h1 {
        font-size: clamp(30px, 7vw, 48px);
        margin: 12px 0;
      }

      .muted {
        color: var(--m);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 18px 0;
      }

      .card,
      .chart,
      .trend {
        background: var(--s);
        border: 1px solid var(--l);
        border-radius: 12px;
        padding: 13px;
      }

      .card small {
        display: block;
        color: var(--m);
      }

      .card strong {
        font-size: 18px;
      }

      .rise {
        color: var(--u);
      }

      .fall {
        color: var(--d);
      }

      .periods {
        display: flex;
        gap: 7px;
        margin: 15px 0;
      }

      button {
        border: 1px solid var(--l);
        background: var(--s);
        border-radius: 18px;
        padding: 7px 12px;
        font-weight: 700;
        color: var(--t);
      }

      button.active {
        background: var(--t);
        color: var(--b);
      }

      button:disabled {
        opacity: 0.45;
      }

      .chart {
        overflow: hidden;
      }

      .svgw {
        overflow-x: auto;
      }

      svg {
        display: block;
        min-width: 620px;
        width: 100%;
        height: auto;
      }

      .legend {
        font-size: 12px;
        color: var(--m);
        margin-bottom: 5px;
      }

      .trend {
        margin: 10px 0;
      }

      @media (max-width: 600px) {
        main {
          padding: 14px;
        }

        .cards {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <a href="../">← Qian Daily Brief</a>
      <p class="muted">觀察標的趨勢</p>
      <h1 id="title">—</h1>
      <p id="stamp" class="muted"></p>
      <div class="cards">
        <div class="card">
          <small>前一交易日</small><strong id="prev">—</strong>
        </div>
        <div class="card">
          <small>最新收盤</small><strong id="latest">—</strong>
        </div>
        <div class="card">
          <small>當日漲跌</small><strong id="day">—</strong>
        </div>
        <div class="card"><small>MA20</small><strong id="m20">—</strong></div>
        <div class="card"><small>MA60</small><strong id="m60">—</strong></div>
        <div class="card">
          <small>期間漲跌</small><strong id="period">—</strong>
        </div>
      </div>
      <div id="trend" class="trend">—</div>
      <div class="periods">
        <button data-n="5">5D</button
        ><button data-n="22" class="active">1M</button
        ><button data-n="66" id="b66">3M</button>
      </div>
      <div class="chart">
        <div class="legend">收盤價｜MA20 虛線｜MA60 點線</div>
        <div class="svgw"><svg id="svg" viewBox="0 0 860 390"></svg></div>
        <p id="range" class="muted"></p>
      </div>
      <p class="muted">
        紅＝上漲、綠＝下跌。3M 僅在頁內有至少 66
        個交易日資料時顯示完整區間；不以不完整資料冒充 3M。
      </p>
    </main>

      function draw(n) {
        const ct = Math.min(n, A.length),
          st = A.length - ct,
          a = A.slice(st),
          d = ds.slice(st);
        document
          .querySelectorAll("button[data-n]")
          .forEach((b) => b.classList.toggle("active", +b.dataset.n === n));
        let mn = Math.min(...a),
          mx = Math.max(...a),
          pd = (mx - mn) * 0.12 || 1,
          L = 70,
          R = 20,
          T = 22,
          B = 55,
          W = 860,
          H = 390,
          X = (i) => L + (i * (W - L - R)) / (a.length - 1),
          Y = (v) => T + ((mx + pd - v) / (mx - mn + 2 * pd)) * (H - T - B),
          col = a.at(-1) >= a[0] ? "#C6534F" : "#2F7D5B",
          h = "";
        for (let i = 0; i < 5; i++) {
          let v = mx + pd - ((mx - mn + 2 * pd) * i) / 4,
            y = T + ((H - T - B) * i) / 4;
          h += `<line x1="${L}" y1="${y}" x2="${W - R}" y2="${y}" stroke="#E8D7B5"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" fill="#806F60" font-size="11">${v.toFixed(v > 100 ? 1 : 2)}</text>`;
        }
        h += `<polyline fill="none" stroke="${col}" stroke-width="3" points="${a.map((v, i) => X(i) + "," + Y(v)).join(" ")}"/>`;

        function maline(n, c, dash) {
          if (A.length < n) return;
          let r = [];
          for (let j = st; j < A.length; j++) {
            if (j >= n - 1)
              r.push([
                j - st,
                A.slice(j - n + 1, j + 1).reduce((u, v) => u + v, 0) / n,
              ]);
          }
          if (r.length > 1)
            h += `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="${dash}" points="${r.map((z) => X(z[0]) + "," + Y(z[1])).join(" ")}"/>`;
        }
        maline(20, "#a66b12", "7 5");
        maline(60, "#6f5aa8", "3 5");
        svg.innerHTML = h;
        let pc = (a.at(-1) / a[0] - 1) * 100;
        period.textContent = (pc >= 0 ? "+" : "") + pc.toFixed(2) + "%";
        period.className = pc >= 0 ? "rise" : "fall";
        range.textContent = `${d[0]} → ${d.at(-1)}｜${a.length} 個交易日｜高 ${Math.max(...a).toFixed(2)}｜低 ${Math.min(...a).toFixed(2)}`;
      }
      document.querySelectorAll("button[data-n]").forEach(
        (b) =>
          (b.onclick = () => {
            if (!b.disabled) draw(+b.dataset.n);
          }),
      );
      draw(22);
    </script>
  </body>
</html>
